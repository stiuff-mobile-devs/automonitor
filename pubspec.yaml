name: automonitor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.2.0
  latlong2: ^0.9.1
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  flutter_map_cancellable_tile_provider: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

