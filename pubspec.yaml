publish_to: 'none'

version: 1.0.1+100

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  geolocator: ^14.0.2
